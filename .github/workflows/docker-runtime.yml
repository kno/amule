# Build and publish the aMule runtime image (daemon + amuleapi + amuleweb),
# multi-arch, to GHCR. Compiles THIS tree with the uTP transport enabled — see
# packaging/linux/docker/Dockerfile. The operational layer is derived from
# ngosang/docker-amule (MIT).
#
# Publishes to ghcr.io/<owner>/amule-emuleai. GHCR needs no extra secrets: the
# workflow's GITHUB_TOKEN authenticates via packages: write below. To also push
# to Docker Hub, add a docker/login-action step with DOCKERHUB_USERNAME/TOKEN
# secrets and the extra tags in the metadata step.
#
# Two variants ship from one run, out of the same Dockerfile and the same
# checkout, so they can never be built from different source:
#
#   :latest, :test (and :v*, :sha-*)   ENABLE_QUIC=YES -- the default image
#                                      since 2026-08-26. The QUIC NAT-T
#                                      transport is compiled in, and it has
#                                      still never completed a handshake with
#                                      another implementation: see the warning
#                                      in packaging/linux/docker/README.md.
#                                      `test` is kept as an alias so anything
#                                      already pulling it keeps working.
#   :noquic (and :v*-noquic, ...)       ENABLE_QUIC unset -- the conservative
#                                      image, QUIC compiled out. The way back.
#
# The QEMU/Buildx/login setup is shared by both builds; only the metadata and
# build steps are duplicated.
name: docker-runtime

on:
  push:
    branches: [master]
    tags: ['v*']
    paths:
      - 'src/**'
      - 'cmake/**'
      - 'CMakeLists.txt'
      - 'packaging/linux/docker/**'
      - '.github/workflows/docker-runtime.yml'
  workflow_dispatch:

concurrency:
  group: docker-runtime-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up QEMU
        # Cross-arch emulation so a single amd64 runner can build arm64 too.
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata (noquic variant)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/amule-emuleai
          # latest on master, semver on tags, and always a commit-sha tag so
          # a published binary maps back to its exact GPL source revision.
          tags: |
            type=raw,value=noquic,enable={{is_default_branch}}
            type=ref,event=tag,suffix=-noquic
            type=semver,pattern={{version}},suffix=-noquic
            type=sha,format=long,suffix=-noquic

      - name: Build and push (noquic variant)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packaging/linux/docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=amule-runtime
          cache-to: type=gha,scope=amule-runtime,mode=max

      - name: Image metadata (default, QUIC)
        id: meta-quic
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/amule-emuleai
          # `test` is the QUIC counterpart of `latest`: the moving tag on the
          # default branch. The -quic suffix on the tag/semver/sha entries keeps
          # every immutable tag distinct from the default variant's, so a pulled
          # QUIC image still maps back to its exact source commit.
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=test,enable={{is_default_branch}}
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=sha,format=long

      - name: Build and push (default, QUIC)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packaging/linux/docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          build-args: |
            ENABLE_QUIC=YES
          push: true
          tags: ${{ steps.meta-quic.outputs.tags }}
          labels: ${{ steps.meta-quic.outputs.labels }}
          # A separate cache scope on purpose. The two variants diverge at the
          # build-deps layer and produce different binaries, so sharing one
          # scope would only invite a cache hit across the divide -- the exact
          # failure that would let QUIC leak into `latest`. The cost is one
          # extra cold cache, which is cheaper than that risk.
          cache-from: type=gha,scope=amule-runtime-quic
          cache-to: type=gha,scope=amule-runtime-quic,mode=max
